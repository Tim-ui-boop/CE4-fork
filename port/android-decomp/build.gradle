plugins {
    id 'com.android.application' version '8.9.2' apply false
    // Kotlin and Compose (18.11.2026): the app's own screens are being rewritten in Jetpack
    // Compose (the owner's request: the Java Views page was "broken as shit", and the new screens
    // are the disc import and the randomizer settings). The game itself stays native; only the
    // app's front end is Kotlin. 2.0.21 pairs with AGP 8.9.2.
    id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.0.21' apply false
}
