name: Android core APK

on:
  push:
    branches:
      - master
      - "ci/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-core-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RE4_JOBS: 2

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: port/android-decomp/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned Android build tools
        shell: bash
        run: |
          yes | sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1"
          echo "$ANDROID_HOME/cmake/3.22.1/bin" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends patch

      - name: Build native game core for ARM32 and ARM64
        shell: bash
        run: |
          chmod +x port/tools/whole_build_android.sh
          port/tools/whole_build_android.sh --ndk "$ANDROID_HOME/ndk/28.2.13676358" --abi all

      - name: Assemble core APK
        working-directory: port/android-decomp
        shell: bash
        run: |
          ./gradlew --no-daemon :app:assembleCoreDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CubeEvil4-core-debug-apk
          path: port/android-decomp/app/build/outputs/apk/core/debug/*.apk
          if-no-files-found: error
          retention-days: 7
