name: Android core APK

on:
  push:
    branches:
      - master
      - "ci/**"
      - "**"      # every branch builds: the APK is the one way to test without a PC
  pull_request:
      branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-core-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RE4_JOBS: 2

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the whole history: the versionCode comes from the commit count

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: port/android-decomp/**/*.gradle*

      - name: Use runner Android SDK and install pinned tools
        shell: bash
        run: |
          set -euo pipefail

          : "${ANDROID_HOME:?ANDROID_HOME missing on runner}"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

          set +e
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          sdk_status=${PIPESTATUS[1]}
          set -o pipefail
          set -e
          if [ "$sdk_status" -ne 0 ]; then
            exit "$sdk_status"
          fi

          "$SDKMANAGER" --install "ndk;28.2.13676358" "cmake;3.22.1"
          echo "$ANDROID_HOME/cmake/3.22.1/bin" >> "$GITHUB_PATH"

          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends patch

      - name: Signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RE4_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RE4_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RE4_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RE4_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # A permanent key so each build installs OVER the one before it (Gradle's signingConfigs.re4 reads these
          # names). Without the secret the build keeps the throwaway debug key and has to be installed by
          # uninstalling first. How to create the key once: port/android-decomp/docs/signing-key.md
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::RE4_KEYSTORE_BASE64 is not set - this APK gets a throwaway signature and will not install over an older build"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/re4.jks"
          {
            echo "RE4_KEYSTORE_FILE=$RUNNER_TEMP/re4.jks"
            echo "RE4_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "RE4_KEY_ALIAS=$KEY_ALIAS"
            echo "RE4_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "signing with the permanent key ($KEY_ALIAS)"

      - name: Build native game core for ARM32 and ARM64
        shell: bash
        env:
          # The build stamp the core logs as its first line (0.99.17, the owner's wish of 17.11.2026):
          # a pasted log then names its own build instead of being identified by guesswork.
          RE4_BUILD_STAMP: ${{ github.sha }}
        run: |
          chmod +x port/tools/whole_build_android.sh
          port/tools/whole_build_android.sh --ndk "$ANDROID_HOME/ndk/28.2.13676358" --abi all

      - name: Assemble core APK
        working-directory: port/android-decomp
        shell: bash
        run: |
          chmod +x gradlew
          # versionCode from the commit count so every build is newer than the last (Android refuses an update whose
          # versionCode is not higher). The base keeps it far above the 120 the release history left behind and
          # leaves room for the app's own numbering.
          COUNT=$(git rev-list --count HEAD)
          VERSION_CODE=$((2000 + COUNT))
          echo "versionCode $VERSION_CODE (commit count $COUNT)"
          ./gradlew --no-daemon :app:assembleCoreDebug -Pre4.versionCode="$VERSION_CODE" -Pre4.versionName="merchant-randomizer"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CubeEvil4-core-debug-apk
          path: port/android-decomp/app/build/outputs/apk/core/debug/*.apk
          if-no-files-found: error
          retention-days: 7
