name: Android core APK

on:
  push:
    branches:
      - master
      - "ci/**"
  pull_request:
      branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-core-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RE4_JOBS: 2

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: port/android-decomp/**/*.gradle*

      - name: Use runner Android SDK and install pinned tools
        shell: bash
        run: |
          set -euo pipefail

          : "${ANDROID_HOME:?ANDROID_HOME missing on runner}"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

          set +e
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          sdk_status=${PIPESTATUS[1]}
          set -o pipefail
          set -e
          if [ "$sdk_status" -ne 0 ]; then
            exit "$sdk_status"
          fi

          "$SDKMANAGER" --install "ndk;28.2.13676358" "cmake;3.22.1"
          echo "$ANDROID_HOME/cmake/3.22.1/bin" >> "$GITHUB_PATH"

          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends patch

      - name: Build native game core for ARM32 and ARM64
        shell: bash
        run: |
          chmod +x port/tools/whole_build_android.sh
          port/tools/whole_build_android.sh --ndk "$ANDROID_HOME/ndk/28.2.13676358" --abi all

      - name: Keep the APK's signing key stable between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: re4-debug-keystore-v1

      - name: Name this build after its branch and commit
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          branch="${branch//\//.}"
          short="${GITHUB_SHA::7}"
          echo "RE4_VERSION_NAME=0.99.18-rc-${branch}-${short}" >> "$GITHUB_ENV"
          echo "the APK names itself: ${RE4_VERSION_NAME:-0.99.18-rc-${branch}-${short}}"

      - name: The signing key of this build
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$HOME/.android/debug.keystore" ]; then
            keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android \
              | grep -E "Owner|SHA256:" | sed 's/^/  /' || true
          else
            echo "  no key yet: this build makes the one every later build reuses"
          fi

      - name: Assemble core APK
        working-directory: port/android-decomp
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleCoreDebug "-Pre4.versionName=${RE4_VERSION_NAME}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CubeEvil4-core-debug-apk
          path: port/android-decomp/app/build/outputs/apk/core/debug/*.apk
          if-no-files-found: error
          retention-days: 7
